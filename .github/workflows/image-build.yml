name: image-build

# Build the pb-runner container image (linux/arm64) and push it to ECR.
#
# Three tags per build (D23):
#   src-<hash>   the build-relevant source; drives the skip check below
#   <git sha>    immutable, and what a rollback points back at
#   v810         MOVING: the passivbot version line this image serves, and
#                the tag the `8rs` task definition points at
#
# The moving tag is what keeps terraform out of the deploy path. Shipping a
# runner fix is a build here plus a bot restart -- ECS re-pulls the tag on
# every task start. Terraform is for adding a version LINE (a v8.2.0 or
# v7.1.2 runner: its own moving tag here, its own engine entry in the
# pbtb-rust tfvars), not for shipping a fix inside one.
#
# Because the tag moves, the image a container ran cannot be read back off
# the task definition afterwards. The binary logs `build=<git sha>` on its
# first line instead (GIT_SHA below -> PB_RUNNER_BUILD in the image).
#
# Why this exists: the first images were built by hand on a dev box with
# `docker buildx --platform linux/arm64`, i.e. rustc under QEMU -- 65 minutes,
# and the trading image's supply chain ran through one laptop. A native arm64
# runner builds the same thing in minutes.
#
# This repo is public. `workflow_dispatch` can only be triggered by someone
# with write access, and the AWS role's trust policy pins `refs/heads/master`,
# so a pull request -- including one from a fork -- can neither run this
# workflow nor assume the role.

# Manual only. Every push producing an image would pile up ECR tags nobody
# rolls out; a build is worth doing when someone intends to deploy it. Run it
# from the master branch -- the AWS role trusts no other ref.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if an image for this source already exists'
        type: boolean
        default: false
      promote:
        description: 'Move the version-line tag to this build (uncheck to build without making it deployable)'
        type: boolean
        default: true

permissions:
  id-token: write # OIDC -> assume the AWS build role
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPO: pb-runner
  ENGINE: engine-v8
  # The passivbot version line this image serves (Cargo.toml pins
  # passivbot_rust to branch pb-runner/rlib-v8.1.0). A new line gets its own
  # tag here and its own engine entry in the pbtb-rust tfvars; within a line
  # the tag just moves.
  LINE_TAG: v810

jobs:
  # Cheap gate on a standard runner: hash the build-relevant files and skip the
  # arm build when ECR already has an image for exactly this source.
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.hash.outputs.tag }}
      needs_build: ${{ steps.decide.outputs.needs_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute source hash
        id: hash
        run: |
          H='${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', 'docker/Dockerfile') }}'
          [ -n "$H" ] || { echo "hashFiles matched nothing - refusing to build a bogus tag" >&2; exit 1; }
          echo "tag=src-$H" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Decide whether to build
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Force rebuild requested."
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if aws ecr describe-images --repository-name "$ECR_REPO" \
               --image-ids imageTag=${{ steps.hash.outputs.tag }} >/dev/null 2>&1; then
            echo "Image for this source already exists (${{ steps.hash.outputs.tag }}) -> skip build."
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "No image for this source (${{ steps.hash.outputs.tag }}) -> build."
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: ${{ needs.check.outputs.needs_build == 'true' }}
    # Native arm64 runner: the target is Graviton (t4g) and QEMU is 5-10x
    # slower. Free for public repositories.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # Persist the cargo registry + target dir across runs so only changed
      # crates recompile.
      - name: Restore cargo build cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            cargo-registry-cache
            cargo-target-cache
          key: pb-runner-buildkit-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            pb-runner-buildkit-

      - name: Inject cargo cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "cargo-registry-cache": "/usr/local/cargo/registry",
              "cargo-target-cache": "/src/target"
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          build-args: |
            ENGINE=${{ env.ENGINE }}
            GIT_SHA=${{ github.sha }}
          push: true
          # Source-hash tag (drives the skip check) + immutable :<sha>. The
          # moving tag is set by the promote job below, which also runs when
          # this build was skipped as already-built.
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ needs.check.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Built & pushed"
            echo "- \`$ECR_REPO:${{ needs.check.outputs.tag }}\` (source hash)"
            echo "- \`$ECR_REPO:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Move the version-line tag onto the image for this source. Separate from
  # `build` so it still runs when the build was skipped (unchanged source,
  # e.g. a docs-only commit), and so `promote: false` can build without
  # making the result deployable. Retagging copies the manifest server-side;
  # it never pulls or pushes layers.
  promote:
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.build.result != 'failure' && github.event.inputs.promote != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Point the version-line tag at this build
        run: |
          set -euo pipefail
          REPO='${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}'
          SRC='${{ needs.check.outputs.tag }}'
          # `imagetools create` copies the manifest inside the registry: no
          # layers move, and the tag lands on the SAME digest as the source.
          #
          # The obvious `aws ecr batch-get-image | put-image` does not: the
          # manifest that comes back is not byte-identical to what was
          # pushed, so ECR stores a second image index with its own digest.
          # The image still runs, but `v810` then shares no digest with any
          # `<git sha>` tag, and each promote leaves another near-duplicate
          # counting against `keep_last_images`.
          docker buildx imagetools create --tag "$REPO:$LINE_TAG" "$REPO:$SRC"
          BEFORE=$(docker buildx imagetools inspect --raw "$REPO:$SRC" | sha256sum | cut -d' ' -f1)
          AFTER=$(docker buildx imagetools inspect --raw "$REPO:$LINE_TAG" | sha256sum | cut -d' ' -f1)
          [ "$BEFORE" = "$AFTER" ] || { echo "$LINE_TAG resolved to a different manifest than $SRC" >&2; exit 1; }
          echo "$LINE_TAG -> $SRC"

      - name: Summary
        run: |
          {
            echo "### Deployable"
            echo "\`$ECR_REPO:$LINE_TAG\` now points at \`${{ needs.check.outputs.tag }}\` (commit \`${{ github.sha }}\`)."
            echo ""
            echo "To roll it out: restart the bot from telebot (Stop, then Run)."
            echo "No terraform apply, no telebot-deploy -- the task definition"
            echo "already points at \`$LINE_TAG\` and ECS re-pulls it on every task start."
          } >> "$GITHUB_STEP_SUMMARY"
