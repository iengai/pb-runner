[workspace]
resolver = "2"
members = [
    "crates/snapshot",
    "crates/exchange-bybit",
    "crates/diffcheck",
    "crates/runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
# Engine line this runner is pinned to. Bump ONLY via docs/PLAN.md "upgrade
# procedure" (re-run diffcheck + shadow run), never casually.
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"

# --- Pinned upstream engines (Phase 1 enables these; see docs/PLAN.md) -------
# passivbot strategy engine. MUST stay pinned to the tag the live strategies
# were optimized on. Requires the `rlib` feature branch (docs/PLAN.md P1.1).
# passivbot_rust = { git = "https://github.com/iengai/passivbot.git", branch = "pb-runner/rlib-v8.1.0", default-features = false }
#
# ccxt official Rust port (transpiled, preview). Pin a COMMIT, not a branch:
# the rust/ tree receives automated regeneration commits daily.
# ccxt = { git = "https://github.com/ccxt/ccxt.git", rev = "<pin>", package = "ccxt", features = ["transpiled-base"] }
# ccxt-pro = { git = "https://github.com/ccxt/ccxt.git", rev = "<same pin>", package = "ccxt-pro" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
