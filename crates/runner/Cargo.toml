[package]
name = "pb-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust live runner for passivbot strategies (Bybit linear perps): snapshot -> pinned engine -> order reconciliation"

[lib]
name = "pb_runner"
path = "src/lib.rs"

[[bin]]
name = "pb-runner"
path = "src/main.rs"

[[bin]]
name = "pb-snapcheck"
path = "src/bin/snapcheck.rs"
required-features = ["engine-v8"]

[[bin]]
name = "pb-plancheck"
path = "src/bin/plancheck.rs"
required-features = ["engine-v8"]

[features]
# Exactly one engine line is compiled into a given binary/image (docs/DECISIONS.md D6).
# `engine-v8` pulls the pinned v8.1.0 rlib branch (workspace dependency).
default = ["engine-v8"]
engine-v8 = ["dep:passivbot_rust"]
engine-v7 = []

[dependencies]
pb-snapshot = { path = "../snapshot" }
pb-exchange-bybit = { path = "../exchange-bybit" }
passivbot_rust = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
aws-config.workspace = true
aws-sdk-s3.workspace = true
uuid.workspace = true
strum.workspace = true
