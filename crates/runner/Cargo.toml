[package]
name = "pb-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust live runner for passivbot strategies (Bybit linear perps): snapshot -> pinned engine -> order reconciliation"

[[bin]]
name = "pb-runner"
path = "src/main.rs"

[features]
# Exactly one engine line is compiled into a given binary/image (docs/DECISIONS.md D6).
# `engine-v8` pulls the pinned v8.1.0 rlib branch (workspace dependency).
default = ["engine-v8"]
engine-v8 = ["dep:passivbot_rust"]
engine-v7 = []

[dependencies]
pb-snapshot = { path = "../snapshot" }
pb-exchange-bybit = { path = "../exchange-bybit" }
passivbot_rust = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
