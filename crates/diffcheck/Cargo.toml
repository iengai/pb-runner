[package]
name = "pb-diffcheck"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Replays recorded passivbot orchestrator calls through the pinned Rust engine and compares order sets"

[[bin]]
name = "diffcheck"
path = "src/main.rs"

[features]
# Replays recordings through the pinned engine (docs/PLAN.md P1.2).
engine = ["dep:passivbot_rust"]

[dependencies]
pb-snapshot = { path = "../snapshot" }
passivbot_rust = { workspace = true, optional = true }
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
