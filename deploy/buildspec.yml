# CodeBuild spec for the pb-runner image (docs/PLAN.md P6.2), mirroring
# pbtb-rust/deploy/passivbot-image/buildspec.yml: runs on a native arm64
# CodeBuild fleet (ARM_CONTAINER), so `docker build` yields linux/arm64.
#
# Required env (set on the project): AWS_REGION, ECR_REGISTRY, ECR_REPO,
# IMAGE_TAG (e.g. 8-v8.1.0-arm64), ENGINE (engine-v8 | engine-v7).
# The passivbot_rust git dependency is fetched from GitHub during the build.
version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to ECR Public"
      - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
      - echo "Logging in to ECR $ECR_REGISTRY"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    commands:
      - echo "Building $ECR_REPO:$IMAGE_TAG engine=$ENGINE (arch $(uname -m))"
      - DOCKER_BUILDKIT=1 docker build -f docker/Dockerfile --build-arg ENGINE="$ENGINE" -t "$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG" .
  post_build:
    commands:
      - echo "Pushing $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG"
      - docker push "$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG"
      - echo "Done."
